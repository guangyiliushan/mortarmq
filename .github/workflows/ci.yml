name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'   # nightly drift check; all jobs run, warnings surface once a day instead of on every push

# Least privilege at the top. Every job here needs read access only; the
# release workflow raises its own where publishing demands it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Temporary bootstrap hotfix: the formerly pinned 0.1.20260920 artifact now
  # returns 403. Keep latest until the official version archive is reachable or
  # a digest-verified mirror is available.
  MOONBIT_INSTALL_VERSION: "latest"
  # Competition compliance line. The toolchain has no native >= assertion, so
  # this is enforced by .github/scripts/assert-moonc.sh rather than eyeballed
  # from the `moon version --all` log.
  MOONC_VERSION_FLOOR: "0.10.14"

jobs:
  lint:
    name: lint
    # Keeps this repository's own conventions enforced instead of aspirational:
    # workflow syntax, workflow security posture, resolvable doc references
    # (CONTRIBUTING.md section 1.2), formal model regressions, and the source
    # hygiene scans (plan markers, control bytes). The remaining prose rule --
    # English-only source -- stays review-enforced (section 2.3).
    # The job name stays short on purpose: it is a required check, and renaming
    # it costs a green run plus a manual re-selection in branch protection.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: set up Node 24 LTS (runs the doc reference gate)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: install zizmor
        run: python3 -m pip install --quiet --user zizmor==1.30.1

      - name: zizmor (auditor persona)
        run: |
          zizmor_bin="$(command -v zizmor || echo "$HOME/.local/bin/zizmor")"
          "$zizmor_bin" --persona=auditor .github

      - name: doc reference gate (CONTRIBUTING section 1.2)
        run: node .github/scripts/check-doc-refs.mjs

      - name: source hygiene gate (plan markers, control bytes)
        run: node .github/scripts/check-source-hygiene.mjs

      - name: commit message checker self-test
        run: bash .github/scripts/check-commit-messages.sh --self-test

      - name: commit message gate (PR or pushed commits)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: bash .github/scripts/check-commit-messages.sh

      # The formal models are the checked form of the fencing argument.
      # These steps keep them compiling, keep the invariants green, and
      # keep the invariants honest: the mutation step removes the fence
      # guard and fails the build unless the checker catches it. The
      # toolchain pin matches the headers in formal/; the Apalache verify
      # path documented in formal/protocol.qnt is not exercised here (a
      # known environment constraint).
      - name: install quint (formal toolchain, pinned)
        run: npm install -g @informalsystems/quint@0.33.0 # zizmor: ignore[adhoc-packages] exact-pinned CI toolchain, never a project dependency; formal/protocol.qnt documents the same pin

      - name: formal models parse and typecheck
        run: |
          for f in formal/*.qnt; do
            quint parse "$f"
            quint typecheck "$f"
          done

      - name: formal invariants hold
        run: |
          quint run --invariant=promiseCoversEveryAppliedEntry formal/fencing.qnt
          quint run --invariant=appliedIsPrefix formal/fencing.qnt

      - name: formal anti-vacuity mutation must fail
        run: |
          cp formal/fencing.qnt "$RUNNER_TEMP/fencing-mutant.qnt"
          sed -i 's/^    e == promise,$/    true,/' "$RUNNER_TEMP/fencing-mutant.qnt"
          if quint run --invariant=promiseCoversEveryAppliedEntry "$RUNNER_TEMP/fencing-mutant.qnt"; then
            echo 'mutated model still passes: the invariant is vacuous'
            exit 1
          fi

  stable:
    name: stable / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: disable auto CRLF (windows)
        if: matrix.os == 'windows-latest'
        run: git config --global core.autocrlf false

      - name: check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes. Keeping the token out of .git/config means a
          # compromised build step cannot reuse it.
          persist-credentials: false

      - name: set up Node 24 LTS (host for the js and wasm-gc test runs)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: set up MSVC (windows, native FFI)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: install moon
        uses: $/.github/actions/install-moon

      - name: assert moonc >= compliance floor
        shell: bash
        run: bash .github/scripts/assert-moonc.sh

      - name: moon version (audit evidence)
        run: moon version --all && moonrun --version

      # A fresh runner ships an empty registry index, so resolving
      # `moonbitlang/async` fails until it is refreshed. `moon update` touches
      # only that index -- it does not move the toolchain, so the moonc version
      # asserted above stays put. Every job that resolves the module graph runs
      # this; do not drop it from a new job.
      - name: moon update
        run: moon update

      - name: gate 1 — moon check (all targets, warnings are errors)
        run: moon check --deny-warn --target all

      - name: gate 2 — moon build (all targets)
        run: moon build --target all

      - name: gate 3 — moon info x4 targets + diff
        run: |
          moon info --target wasm,wasm-gc,js,native
          git diff --exit-code

      - name: gate 4 — moon fmt + diff
        run: |
          moon fmt
          git diff --exit-code

      # Property commit tier: the seed-pinned frame properties ride
      # along in the suite below on every commit (budget <=60s). The
      # pollution property is daily-tiered in daily-props.yml; its pinned
      # suite copy is a cheap regression snapshot.
      - name: gate 5 — moon test (native)
        run: moon test

      - name: gate 6 — moon test (release)
        run: moon test --release

      - name: gate 7 — moon test (js)
        run: moon test --target js

      - name: gate 8 — property budget (commit tier <=60s)
        run: node .github/scripts/check-prop-budget.mjs

      - name: gate 9 — m1 fault matrix (every case green)
        run: node .github/scripts/check-m1-matrix.mjs

      - name: gate 8 — moon tree (dependency graph acyclic)
        shell: bash
        run: |
          out="$(moon tree)"
          echo "$out"
          if grep -F '(cycle)' <<<"$out"; then
            echo 'dependency cycle: the module graph must stay acyclic (CONTRIBUTING section 5)'
            exit 1
          fi

  nightly:
    name: nightly drift warning / ${{ matrix.os }}
    # Toolchain drift early warning: a separate job allowed to fail so it never
    # blocks a PR (mirrors moonbitlang/async nightly-build). It only runs on
    # the daily schedule (or a manual dispatch), never on push or PR, so its
    # by-design red stays out of every commit's check list.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 20
    env:
      MOONBIT_INSTALL_VERSION: nightly
    steps:
      - name: disable auto CRLF (windows)
        if: matrix.os == 'windows-latest'
        run: git config --global core.autocrlf false

      - name: check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up Node 24 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: set up MSVC (windows, native FFI)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: install moon (nightly channel)
        uses: $/.github/actions/install-moon

      - name: moon version
        run: moon version --all && moonrun --version

      # Empty registry index on a fresh runner; see the note in `stable`.
      - name: moon update
        run: moon update

      - name: moon check (all targets)
        run: moon check --deny-warn --target all

      - name: moon test
        run: moon test

  wasm-gc:
    name: wasm-gc pure core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up Node 24 LTS (host for the wasm-gc load smoke test)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: install moon
        uses: $/.github/actions/install-moon

      # Empty registry index on a fresh runner; see the note in `stable`.
      - name: moon update
        run: moon update

      - name: moon check (wasm-gc)
        run: moon check --deny-warn --target wasm-gc

      - name: moon test (wasm-gc)
        run: moon test --target wasm-gc

      # The old artifact upload went away: moon build emits .core modules
      # under _build/, never .wasm under target/, so the step warned on every
      # run. The check and test steps above already prove the build.

  coverage:
    name: coverage / ${{ matrix.os }}
    strategy:
      # Keep the other leg alive when one fails: losing half the coverage data
      # would defeat the flaky-evidence discipline in CONTRIBUTING section 5.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: disable auto CRLF (windows)
        if: matrix.os == 'windows-latest'
        run: git config --global core.autocrlf false

      - name: check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up MSVC (windows, native FFI)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: install moon
        uses: $/.github/actions/install-moon

      # Empty registry index on a fresh runner; see the note in `stable`.
      - name: moon update
        run: moon update

      - name: run tests with coverage
        run: |
          moon version --all
          moon test --enable-coverage

      - name: upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-${{ matrix.os }}
          path: _build/moonbit_coverage_*
          retention-days: 7

  coverage-report:
    name: coverage report
    needs: [coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install moon
        uses: $/.github/actions/install-moon

      # Empty registry index on a fresh runner; see the note in `stable`.
      # Without it this job's rebuild step cannot resolve `moonbitlang/async`.
      - name: moon update
        run: moon update

      - name: download Windows coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # Must match the upload step's `coverage-data-${{ matrix.os }}`, which
          # expands to `coverage-data-windows-latest`, not `coverage-data-windows`.
          name: coverage-data-windows-latest
          path: _build

      - name: strip CRLF from the Windows coverage data
        run: |
          shopt -s nullglob
          for f in _build/moonbit_coverage_*; do
            sed -i 's/\r//g' "$f"
          done

      - name: download Linux coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-data-ubuntu-latest
          path: _build

      - name: rebuild with coverage and report
        run: |
          moon test --enable-coverage --build-only
          report="$(moon coverage report -f summary)"
          echo "$report"
          {
            echo "## Coverage summary"
            echo '```text'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: docs build (dead-link gate)
    # CONTRIBUTING section 6.3 promises that `npm run docs:build` runs in CI.
    # docs-site.yml only fires on a push to main for docs paths, so without
    # this job a pull request could break the site and nobody would find out.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up Node 24 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: install docs toolchain
        run: npm ci --no-fund --no-audit

      - name: build docs (a dead link fails the build)
        run: npm run docs:build

      - name: the published site carries the Inter license (OFL 1.1 clause 2)
        run: |
          if [ ! -f docs/.vitepress/dist/OFL.txt ]; then
            echo "docs/public/OFL.txt did not reach the build output."
            echo "Inter is redistributed with this site, so clause 2 of the"
            echo "SIL Open Font License requires the license text to travel with it."
            exit 1
          fi

