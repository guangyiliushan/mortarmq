name: docs-site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'demo/**'
      - 'package.json'
      - 'package-lock.json'   # a lockfile-only change must still rebuild the site
  workflow_dispatch:

# Least privilege. The write scopes live on the deploy job that needs them.
permissions:
  contents: read

# One deployment at a time, and let any run in flight finish: the VitePress
# Pages template warns that cancelling an in-progress deployment can leave the
# live site on an older artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read        # configure-pages reads the Pages configuration
    steps:
      - name: check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `lastUpdated` derives each page's date from `git log` on the file;
          # a shallow clone only has HEAD and would collapse every date to it.
          fetch-depth: 0

      - name: set up Node 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: cache VitePress
        # VitePress keeps its build cache under `docs/.vitepress/cache`; a
        # restored cache skips most markdown/SSG work on rebuilds.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: docs/.vitepress/cache
          key: ${{ runner.os }}-vitepress-${{ hashFiles('docs/**', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-

      - name: install docs toolchain
        # `npm ci` installs exactly what package-lock.json pins. `npm install`
        # would happily resolve a newer transitive dependency, so the published
        # site could differ from the one that was reviewed.
        run: npm ci --no-fund --no-audit

      - name: build docs (VitePress + mermaid plugin)
        run: npm run docs:build

      - name: copy the demo static side-route into the artifact (one Pages site serves docs and demo)
        run: |
          mkdir -p docs/.vitepress/dist/demo
          cp -r demo/* docs/.vitepress/dist/demo/

      - name: configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: deploy to GitHub Pages
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write       # deploy-pages publishes the artifact
      id-token: write    # OIDC identity for the Pages deployment, no long-lived key
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
