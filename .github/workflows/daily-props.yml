# Daily L2 property tier: the random-seed sweep the commit budget
# cannot afford. The pollution property runs here daily while the
# commit tier runs the seed-pinned frame properties inside the
# regular suite (ci.yml `stable` gates 5-7).
name: daily-props

on:
  schedule:
    # 02:23 UTC daily. Off the top of the hour on purpose -- the :00 cron
    # slots are the busiest on shared runners.
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Sweeps are independent of any ref; never cancel a running sweep in
# favor of the next scheduled one.
concurrency:
  group: daily-props
  cancel-in-progress: false

env:
  # Matches ci.yml: bootstrap hotfix note plus the competition compliance
  # floor, enforced by assert-moonc.sh.
  MOONBIT_INSTALL_VERSION: "latest"
  MOONC_VERSION_FLOOR: "0.10.14"

jobs:
  daily-tier:
    name: daily property sweeps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes; keeping the token out of .git/config
          # means a compromised build step cannot reuse it.
          persist-credentials: false

      - name: install moon
        uses: $/.github/actions/install-moon

      - name: assert moonc >= compliance floor
        run: bash .github/scripts/assert-moonc.sh

      - name: moon version (audit evidence)
        run: moon version --all && moonrun --version

      # A fresh runner ships an empty registry index; see the note in
      # ci.yml `stable`.
      - name: moon update
        run: moon update

      # MORTARMQ_PROP_DAILY flips the daily-tier property files into
      # registry daily mode: run-unique seed (logged for reproduction),
      # count=1000, max_size=256. Three sweeps run here: the protocol
      # pollution sweep (frame_props_daily_test.mbt), the cluster quorum
      # sweep (quorum_props_test.mbt), and the broker rebalance sweep
      # (rebalance_props_daily_test.mbt). The registry budget is <=30min;
      # the sweeps run in seconds and the timeout is the guard, not the
      # expectation.
      - name: daily property sweeps (random seed, count=1000, max_size=256)
        env:
          MORTARMQ_PROP_DAILY: "1"
        run: |
          moon test protocol/frame_props_daily_test.mbt
          moon test cluster/quorum_props_test.mbt
          moon test broker/rebalance_props_daily_test.mbt
